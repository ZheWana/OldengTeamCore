name: Bug report
description: Report a reproducible Team Core problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, signed URLs, and exported configuration strings before submitting.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Team Core version, Obsidian version, and operating system.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste output from “复制 Team Core 诊断信息” if relevant.
