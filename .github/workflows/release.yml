name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release metadata
        run: npm run verify-release -- "$GITHUB_REF_NAME"
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Team Core $GITHUB_REF_NAME" \
            --generate-notes \
            dist/main.js dist/manifest.json dist/styles.css
